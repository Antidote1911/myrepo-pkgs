# Wave theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "wallpaper"

[colors]
background = "#323f4e"
foreground = "#f8f8f2"
color0 = "#3d4c5f"
color1 = "#f48fb1"
color2 = "#a1efd3"
color3 = "#f1fa8c"
color4 = "#92b6f4"
color5 = "#bd99ff"
color6 = "#87dfeb"
color7 = "#f8f8f2"
color8 = "#56687e"
color9 = "#ee4f84"
color10 = "#53e2ae"
color11 = "#f1ff52"
color12 = "#6498ef"
color13 = "#985eff"
color14 = "#24d1e7"
color15 = "#e5e5e5"
accent = "#BD99FF"
element_bg = "#3D4C5F"
element_fg = "#F8F8F8"
alt_background = "#556984"  # lighten(element_bg, 0.12)
alt_foreground = "#acacac"  # darken(element_fg, 0.30)

[roles]
bar_background = "element_bg"
bar_foreground = "element_fg"
rofi_background = "element_bg"
rofi_alt_background = "gradient2"
rofi_foreground = "element_fg"
dunst_background = "element_bg"
dunst_foreground = "element_fg"

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Wave"
icon_theme = "Luv-Folders-Dark"
cursor_theme = "Vimix"
color_scheme = "prefer-dark"
rofi_icons = "Luv-Folders-Dark"
geany_colors = "wave.conf"

[openbox]
theme = "OB-Wave"
layout = "LIMC"
menu = "menu-icons.xml"
# top, bottom, left, right
margins = [10, 48, 10, 10]

[dunst]
width = 300
height = 80
offset = "10x48"
origin = "bottom-right"
border = 0
separator = 2

[plank]
hide_mode = "auto"
offset = 80
position = "right"
theme = "Transparent"
icon_size = 32
zoom_percent = 120

[picom]
backend = "glx"
corner_radius = 0
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0

[polybar]
gradient = true
