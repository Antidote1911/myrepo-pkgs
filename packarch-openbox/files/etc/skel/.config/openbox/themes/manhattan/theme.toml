# Manhattan theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "/usr/share/backgrounds/manhattan.jpg"

[colors]
background = "#282f37"
foreground = "#f1fcf9"
color0 = "#20262c"
color1 = "#db86ba"
color2 = "#74dd91"
color3 = "#e49186"
color4 = "#75dbe1"
color5 = "#b4a1db"
color6 = "#9ee9ea"
color7 = "#f1fcf9"
color8 = "#465463"
color9 = "#d04e9d"
color10 = "#4bc66d"
color11 = "#db695b"
color12 = "#3dbac2"
color13 = "#825ece"
color14 = "#62cdcd"
color15 = "#e0e5e5"
element_bg = "#1F252B"
element_fg = "#F0FBF8"
element_hl = "#B4A1DB"
alt_background = "#2a323a"  # lighten(element_bg, 0.05)
alt_foreground = "#77dbc0"  # darken(element_fg, 0.30)

[roles]
bar_background = "element_bg"
bar_foreground = "element_fg"
bar_accent = "element_hl"
screenshot_border = "element_hl"
rofi_background = "element_bg"
rofi_foreground = "element_fg"
rofi_selected = "element_hl"
dunst_background = "element_bg"
dunst_foreground = "element_fg"

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Manhattan"
icon_theme = "Luv-Folders-Dark"
cursor_theme = "Vimix-Dark"
color_scheme = "prefer-dark"
rofi_icons = "Luv-Folders-Dark"
geany_colors = "manhattan.conf"

[openbox]
theme = "OB-Manhattan"
layout = "LIMC"
menu = "menu-icons.xml"
# top, bottom, left, right
margins = [10, 48, 10, 10]

[dunst]
width = 300
height = 80
offset = "20x20"
origin = "top-right"
border = 0
separator = 2

[plank]
hide_mode = "intelligent"
offset = 80
position = "right"
theme = "Transparent"
icon_size = 32
zoom_percent = 120

[picom]
backend = "glx"
corner_radius = 6
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0
