# Nord theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "/usr/share/backgrounds/nord.jpg"

[colors]
background = "#2E3440"
foreground = "#D8DEE9"
color0 = "#3B4252"
color1 = "#BF616A"
color2 = "#A3BE8C"
color3 = "#EBCB8B"
color4 = "#81A1C1"
color5 = "#B48EAD"
color6 = "#88C0D0"
color7 = "#E5E9F0"
color8 = "#4C566A"
color9 = "#BF616A"
color10 = "#A3BE8C"
color11 = "#EBCB8B"
color12 = "#81A1C1"
color13 = "#B48EAD"
color14 = "#8FBCBB"
color15 = "#ECEFF4"
accent = "#81A1C1"
alt_background = "#39404f"  # lighten(background, 0.05)
alt_foreground = "#768bb2"  # darken(foreground, 0.30)

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Arc-Dark"
icon_theme = "Arc-Circle"
cursor_theme = "Qogirr"
color_scheme = "prefer-dark"
rofi_icons = "Arc-Circle"
geany_colors = "arc.conf"

[openbox]
theme = "OB-Arc-Dark"
layout = "DLIMC"
menu = "menu-icons.xml"
# top, bottom, left, right
margins = [42, 10, 10, 10]

[dunst]
width = 300
height = 80
offset = "10x42"
origin = "top-right"
border = 1
separator = 1

[picom]
backend = "glx"
corner_radius = 0
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0
