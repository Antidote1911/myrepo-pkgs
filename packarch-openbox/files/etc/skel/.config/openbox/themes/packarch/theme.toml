# Packarch theme of packarch-skin (see "packarch-skin --help"), formerly
# manhattan: colors of the packarch-default.jpg wallpaper.
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

name = "Packarch"
wallpaper = "/usr/share/backgrounds/packarch-default.jpg"

[colors]
# packarch-default.jpg: anthracite background, Pac-Man yellow, ghost colors
background = "#16161a"
foreground = "#e6e6e6"
color0 = "#222228"
color1 = "#ec3a2a"
color2 = "#3ddc4a"
color3 = "#f8c602"
color4 = "#2f80ff"
color5 = "#ff4fa3"
color6 = "#3ad6e0"
color7 = "#d8d8d8"
color8 = "#44444c"
color9 = "#ff5a48"
color10 = "#62f070"
color11 = "#ffdc3a"
color12 = "#5a9cff"
color13 = "#ff78bc"
color14 = "#6ae4ec"
color15 = "#f4f4f4"
element_bg = "#101012"
element_fg = "#ececec"
element_hl = "#f8c602"
alt_background = "lighten(element_bg, 0.06)"
alt_foreground = "darken(element_fg, 0.35)"

[roles]
bar_background = "element_bg"
bar_foreground = "element_fg"
bar_accent = "element_hl"
screenshot_border = "element_hl"
rofi_background = "element_bg"
rofi_foreground = "element_fg"
rofi_selected = "element_hl"
dunst_background = "element_bg"
dunst_foreground = "element_fg"

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 10"
openbox = "Noto Sans"
openbox_size = 10
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Packarch-Packarch"
icon_theme = "Luna-Antidote-Dark"
cursor_theme = "Vimix-Dark"
color_scheme = "prefer-dark"
rofi_icons = "Luna-Antidote-Dark"
geany_colors = "manhattan.conf"

[openbox]
theme = "OB-Packarch-Packarch"
layout = "LIMC"
menu = "menu-icons.xml"
# top, bottom, left, right
margins = [10, 10, 10, 10]

[dunst]
width = 300
height = 80
offset = "20x20"
origin = "top-right"
border = 0
separator = 2

[picom]
backend = "glx"
corner_radius = 6
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0

[polybar]
bars = ["main", "top"]
polywins = true
