# Rainy theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "wallpaper"

[colors]
background = "#141c21"
foreground = "#93a1a1"
color0 = "#263640"
color1 = "#d12f2c"
color2 = "#819400"
color3 = "#b08500"
color4 = "#2587cc"
color5 = "#696ebf"
color6 = "#289c93"
color7 = "#bfbaac"
color8 = "#4a697d"
color9 = "#fa3935"
color10 = "#a4bd00"
color11 = "#d9a400"
color12 = "#2ca2f5"
color13 = "#8086e8"
color14 = "#33c5ba"
color15 = "#fdf6e3"
accent = "#5294E2"
alt_background = "#1e2a31"  # lighten(background, 0.05)
alt_foreground = "#485353"  # darken(foreground, 0.30)

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "JetBrains Mono 10"

[appearance]
gtk_theme = "Arc"
icon_theme = "Arc-Circle"
cursor_theme = "Future"
color_scheme = "prefer-light"
rofi_icons = "Arc-Circle"
geany_colors = "beach.conf"

[openbox]
theme = "OB-Arc-Carbon"
layout = "MLC"
menu = "menu-glyphs.xml"
# top, bottom, left, right
margins = [58, 20, 20, 20]

[dunst]
width = 300
height = 80
offset = "20x58"
origin = "top-right"
border = 0
separator = 2

[plank]
hide_mode = "intelligent"
offset = 0
position = "right"
theme = "Transparent"
icon_size = 32
zoom_percent = 120

[picom]
backend = "glx"
corner_radius = 0
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0
