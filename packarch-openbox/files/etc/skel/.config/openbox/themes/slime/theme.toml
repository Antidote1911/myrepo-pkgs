# Slime theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "wallpaper"

[colors]
background = "#ffffff"
foreground = "#383a42"
color0 = "#383a42"
color1 = "#e45649"
color2 = "#50a14f"
color3 = "#c18401"
color4 = "#0184bc"
color5 = "#a626a4"
color6 = "#0997b3"
color7 = "#909090"
color8 = "#383a42"
color9 = "#e45649"
color10 = "#50a14f"
color11 = "#c18401"
color12 = "#0184bc"
color13 = "#a626a4"
color14 = "#0997b3"
color15 = "#909090"
accent = "#0997B3"
alt_background = "#e6e6e6"  # darken(background, 0.10)
alt_foreground = "#9b9eaa"  # lighten(foreground, 0.40)

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Slime"
icon_theme = "Luv-Folders"
cursor_theme = "Qogirr-Dark"
color_scheme = "prefer-light"
rofi_icons = "Luv-Folders"
geany_colors = "slime.conf"

[openbox]
theme = "OB-Slime"
layout = "CLM"
menu = "menu-glyphs.xml"
# top, bottom, left, right
margins = [40, 10, 10, 10]

[dunst]
width = 300
height = 80
offset = "10x40"
origin = "top-right"
border = 0
separator = 2

[plank]
hide_mode = "auto"
offset = 95
position = "right"
theme = "Transparent"
icon_size = 32
zoom_percent = 120

[picom]
backend = "glx"
corner_radius = 0
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0
