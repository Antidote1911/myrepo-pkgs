# Gray theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "/usr/share/backgrounds/gray.png"

[colors]
background = "#131519"
foreground = "#d8d8d8"
color0 = "#3B4252"
color1 = "#BF616A"
color2 = "#A3BE8C"
color3 = "#EBCB8B"
color4 = "#81A1C1"
color5 = "#B48EAD"
color6 = "#88C0D0"
color7 = "#E5E9F0"
color8 = "#4C566A"
color9 = "#BF616A"
color10 = "#A3BE8C"
color11 = "#EBCB8B"
color12 = "#81A1C1"
color13 = "#B48EAD"
color14 = "#8FBCBB"
color15 = "#ECEFF4"
accent = "#d8d8d8"
alt_background = "#292d36"  # lighten(background, 0.10)
alt_foreground = "#585858"  # darken(foreground, 0.50)

[fonts]
polybar = "Iosevka:style=bold:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "JetBrains Mono 10"

[appearance]
gtk_theme = "Kripton"
icon_theme = "Vimix-White-Dark"
cursor_theme = "Bibata"
color_scheme = "prefer-dark"
rofi_icons = "Vimix-White-Dark"
geany_colors = "mountain.conf"

[openbox]
theme = "OB-Gray"
layout = "LC"
menu = "menu-glyphs.xml"
# top, bottom, left, right
margins = [80, 20, 20, 20]

[dunst]
width = 300
height = 80
offset = "40x100"
origin = "top-right"
border = 0
separator = 2

[picom]
backend = "glx"
corner_radius = 10
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0
