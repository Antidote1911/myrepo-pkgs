# Adaptive theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "/usr/share/backgrounds/adaptive.png"

[colors]
background = "#222d32"
foreground = "#c4c7c5"
color0 = "#263640"
color1 = "#ec7875"
color2 = "#61c766"
color3 = "#fdd835"
color4 = "#42a5f5"
color5 = "#ba68c8"
color6 = "#4dd0e1"
color7 = "#bfbaac"
color8 = "#4a697d"
color9 = "#fb8784"
color10 = "#70d675"
color11 = "#ffe744"
color12 = "#51b4ff"
color13 = "#c979d7"
color14 = "#5cdff0"
color15 = "#fdf6e3"
accent = "#00BCD4"
alt_background = "#415660"  # lighten(background, 0.15)
alt_foreground = "#767c78"  # darken(foreground, 0.30)

[roles]
rofi_alt_background = "gradient2"

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 10"
openbox = "Noto Sans"
openbox_size = 13
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Adapta-Nokto"
icon_theme = "Luv-Folders-Dark"
cursor_theme = "Vimix"
color_scheme = "prefer-dark"
rofi_icons = "Luv-Folders-Dark"
geany_colors = "adapta.conf"

[openbox]
theme = "OB-Adapta-Nokto"
layout = "LIMC"
menu = "menu-icons.xml"
# top, bottom, left, right
margins = [44, 10, 10, 10]

[dunst]
width = 300
height = 80
offset = "10x44"
origin = "top-right"
border = 1
separator = 1

[picom]
backend = "glx"
corner_radius = 0
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0

[polybar]
gradient = true
polywins = true
