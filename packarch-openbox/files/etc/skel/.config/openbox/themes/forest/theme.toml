# Forest theme of packarch-skin (see "packarch-skin --help").
# Colors: "#RRGGBB", another color of [colors], gradient1..6 ([polybar]
# gradient), lighten(COLOR, AMOUNT) or darken(COLOR, AMOUNT) (HSL lightness).

wallpaper = "wallpaper"

[colors]
background = "#222d32"
foreground = "#c4c7c5"
color0 = "#263640"
color1 = "#ec7875"
color2 = "#61c766"
color3 = "#fdd835"
color4 = "#42a5f5"
color5 = "#ba68c8"
color6 = "#4dd0e1"
color7 = "#bfbaac"
color8 = "#4a697d"
color9 = "#fb8784"
color10 = "#70d675"
color11 = "#ffe744"
color12 = "#51b4ff"
color13 = "#c979d7"
color14 = "#5cdff0"
color15 = "#fdf6e3"
accent = "#00BCD4"
alt_background = "#2c3b41"  # lighten(background, 0.05)
alt_foreground = "#767c78"  # darken(foreground, 0.30)

[fonts]
polybar = "Iosevka:size=10;3"
rofi = "Iosevka 10"
terminal = "JetBrainsMono Nerd Font"
terminal_size = 10
geany = "JetBrainsMono Nerd Font 10"
gtk = "Noto Sans 9"
openbox = "JetBrains Mono"
openbox_size = 9
dunst = "Iosevka Custom 9"

[appearance]
gtk_theme = "Adapta-Nokto"
icon_theme = "Packarch-Dark"
cursor_theme = "Pear"
color_scheme = "prefer-dark"
rofi_icons = "Packarch-Dark"
geany_colors = "adapta.conf"

[openbox]
theme = "OB-Adapta-Nokto"
layout = "CLM"
menu = "menu-icons.xml"
# top, bottom, left, right
margins = [40, 10, 10, 10]

[dunst]
width = 300
height = 80
offset = "10x40"
origin = "top-right"
border = 0
separator = 2

[plank]
hide_mode = "auto"
offset = 95
position = "right"
theme = "Transparent"
icon_size = 32
zoom_percent = 120

[picom]
backend = "glx"
corner_radius = 0
shadow_radius = 20
shadow_opacity = "0.60"
shadow_offset_x = -20
shadow_offset_y = -20
blur_method = "none"
blur_strength = 0
