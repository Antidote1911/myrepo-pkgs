# Dark LightDM greeter: Greybird-dark (packarch-themes), Luna-Red-Dark icons
# (packarch-icons), Qogir-Dark cursor (qogir-icon-theme), wallpaper-alt.png
# background (packarch-backgrounds).
# /etc/lightdm/lightdm-gtk-greeter.conf is read after this file.
[greeter]
theme-name = Greybird-dark
icon-theme-name = Luna-Red-Dark
cursor-theme-name = Qogir-Dark
background = /usr/share/backgrounds/wallpaper-alt.png
