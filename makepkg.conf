#!/hint/bash
#
# makepkg configuration of the [packarch] packages (used by build.sh): the one
# of the system, with generic x86-64 code (the system one may use
# -march=native on CachyOS, and these packages run on any processor) and a
# stronger compression (the icon package stays under the 100 MB file limit of
# GitHub).

source /etc/makepkg.conf

CFLAGS="-march=x86-64 -mtune=generic -O2 -pipe -fno-plt -fexceptions \
        -Wp,-D_FORTIFY_SOURCE=3 -Wformat -Werror=format-security \
        -fstack-clash-protection -fcf-protection"
CXXFLAGS="$CFLAGS -Wp,-D_GLIBCXX_ASSERTIONS"
RUSTFLAGS="-C opt-level=2"

COMPRESSZST=(zstd -c -T0 -19 -)
